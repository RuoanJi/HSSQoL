<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSS DX Free Battles</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1f2328; --muted: #6a6f76; --line: #e3e1da;
  --accent: #1f6f8b; --accent-soft: #e3f0f4; --hit: #fff2c2; --hit-ink: #6b4b00; --bar: #8fc1d1;
  --mon: #efe7f7; --evo: #b3541e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --panel: #1d2126; --ink: #e6e6e3; --muted: #9aa0a6; --line: #30353c;
    --accent: #6fb7d0; --accent-soft: #1f3540; --hit: #4a3d12; --hit-ink: #ffe08a; --bar: #2f6b80;
    --mon: #32293d; --evo: #f0a06a;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1d2126; --ink: #e6e6e3; --muted: #9aa0a6; --line: #30353c;
  --accent: #6fb7d0; --accent-soft: #1f3540; --hit: #4a3d12; --hit-ink: #ffe08a; --bar: #2f6b80;
  --mon: #32293d; --evo: #f0a06a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top nav { display: flex; gap: 14px; font-size: 13px; flex-wrap: wrap; }
.top a { color: var(--accent); }
h1 { font-size: 18px; margin: 14px 0 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 10px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button small { color: inherit; opacity: .7; margin-left: 3px; }
input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--ink); min-width: 0; }
input[type=search] { flex: 1 1 220px; }
.count { color: var(--muted); font-size: 12px; }
main { padding: 14px 0 40px; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.note b { color: var(--ink); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; background: var(--panel); }
th[data-k] { cursor: pointer; user-select: none; }
th[data-k]:hover { color: var(--ink); }
th .arr { font-size: 10px; margin-left: 3px; }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.fleet { cursor: pointer; }
tr.fleet:hover td { background: var(--accent-soft); }
tr.fleet td:first-child::before { content: '▸'; color: var(--muted); margin-right: 4px; display: inline-block; width: 10px; }
tr.fleet.open td:first-child::before { content: '▾'; }
tr.roster > td { background: var(--bg); padding: 8px 10px 12px; }
.roster table { font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.roster th { font-size: 11px; }
.chip { display: inline-block; padding: 0 6px; margin: 1px 4px 1px 0; border-radius: 4px; background: var(--accent-soft); font-size: 12px; white-space: nowrap; }
.chip.mon { background: var(--mon); }
.tag { font-size: 11px; color: var(--evo); font-weight: 600; margin-left: 4px; }
.bar { display: inline-block; height: 8px; background: var(--bar); border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.sub { color: var(--muted); font-size: 12px; }
.tierlbl { display: inline-block; min-width: 22px; text-align: center; border-radius: 4px; background: var(--accent-soft); font-size: 12px; }
mark { background: var(--hit); color: var(--hit-ink); padding: 0 2px; border-radius: 3px; }
h3 { font-size: 13px; margin: 10px 0 6px; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>High Sea Saga DX · 自由对战对手</h1><nav><a href="jobs.html">职业</a><a href="ports.html">港口</a><a href="loot.html">掉落表</a><a href="gear.html">装备与道具</a></nav></div>
  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <input id="q" type="search" placeholder="搜索：舰队、职业、人物、怪物、装备、技能…">
    <span class="count" id="count"></span>
  </div>
</div></header>
<main class="wrap"><div id="out"></div></main>
<script>
const P = /*FB_DATA*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n == null ? '—' : n.toLocaleString('en-US');
const st = { tier: -1, key: 'hp', dir: 1 };
try { Object.assign(st, JSON.parse(localStorage.getItem('hssFreeBattle') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('hssFreeBattle', JSON.stringify({ tier: st.tier, key: st.key, dir: st.dir })); } catch (e) {} };
const open = new Set();

$('#tabs').innerHTML = `<button data-t="-1">全部<small>${P.fleets.length}</small></button>` +
  P.tiers.map(t => `<button data-t="${t.tier}" title="Net海贼等级 ${t.ranks}">档 ${t.tier}<small>${t.count}</small></button>`).join('');

function hl(text, q) {
  text = String(text); const t = esc(text); if (!q) return t;
  const i = text.toLowerCase().indexOf(q); if (i < 0) return t;
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
const hay = f => [f.name, f.cannon, ...f.crew.flatMap(c => [c.job, c.char, c.birthJob, ...c.equip, ...c.skills]),
  ...f.monsters.flatMap(m => [m.name, ...m.skills])].join(' ').toLowerCase();
P.fleets.forEach(f => f._h = hay(f));
const val = (f, k) => ({ index: f.index, name: f.name, tier: f.tier, cannon: f.cannon, crew: f.crew.length, mon: f.monsters.length,
  lv: f.crewLvMax, avg: f.crewLvAvg, hp: f.hp, atk: f.atk })[k];
function th(k, label, cls = '') {
  const a = st.key === k ? `<span class="arr">${st.dir > 0 ? '▲' : '▼'}</span>` : '';
  return `<th data-k="${k}" class="${cls}">${label}${a}</th>`;
}
function roster(f, q) {
  const crew = f.crew.length ? `<h3>船员 ${f.crew.length}</h3><table><tr><th>职业</th><th>人物</th><th class="n">Lv</th>${P.stats.map(s => `<th class="n">${s}</th>`).join('')}<th class="n">船长</th><th>装备</th><th>技能</th></tr>` +
    f.crew.map(c => `<tr><td>${hl(c.job, q)}${c.birthJob ? `<div class="sub">原职业 ${hl(c.birthJob, q)}</div>` : ''}</td>
      <td>${c.char ? hl(c.char, q) : '<span class="sub">—</span>'}<div class="sub">${c.gender ? '女' : '男'}${c.mastered ? ' · 满级职业 ' + c.mastered : ''}</div></td>
      <td class="n">${c.lv}</td>${c.stats.map(v => `<td class="n">${fmt(v)}</td>`).join('')}<td class="n">${c.leader}</td>
      <td>${c.equip.map(e => `<span class="chip">${hl(e, q)}</span>`).join('') || '<span class="sub">—</span>'}</td>
      <td>${c.skills.map(s => `<span class="chip">${hl(s, q)}</span>`).join('') || '<span class="sub">—</span>'}</td></tr>`).join('') + '</table>' : '';
  const mons = f.monsters.length ? `<h3>怪物 ${f.monsters.length}</h3><table><tr><th>怪物</th><th class="n">Lv</th><th>状态</th><th>技能</th></tr>` +
    f.monsters.map(m => `<tr><td>${hl(m.name, q)}</td><td class="n">${m.lv}</td>
      <td>${m.finalEvo ? '<span class="tag">觉醒</span>' : ''}${m.nightmare ? '<span class="tag" title="nightmareFlag_，含义未追踪">噩</span>' : ''}${m.evo ? `<span class="sub"> 进化 ${m.evo}</span>` : ''}${!m.finalEvo && !m.nightmare && !m.evo ? '<span class="sub">—</span>' : ''}</td>
      <td>${m.skills.map(s => `<span class="chip mon">${hl(s, q)}</span>`).join('') || '<span class="sub">—</span>'}</td></tr>`).join('') + '</table>' : '';
  return `<tr class="roster"><td colspan="10">${crew}${mons}<div class="sub" style="margin-top:6px">文件 ${esc(f.file)} · 池序号 #${f.index}</div></td></tr>`;
}
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', +b.dataset.t === st.tier));
  const q = $('#q').value.trim().toLowerCase();
  let rows = P.fleets.filter(f => (st.tier < 0 || f.tier === st.tier) && (!q || f._h.includes(q)));
  rows.sort((a, b) => { const x = val(a, st.key), y = val(b, st.key);
    return (typeof x === 'string' ? x.localeCompare(y, 'zh') : x - y) * st.dir || a.index - b.index; });
  const maxHp = Math.max(...P.fleets.map(f => f.hp));
  const t = P.tiers[st.tier];
  $('#count').textContent = `${rows.length} 支舰队`;
  const note = `<p class="note">自由对战（Net対戦）的对手不是随机生成的，而是游戏自带的 <b>${P.fleets.length} 支玩家舰队记录</b>，按 Net 海贼等级分成 8 档。
    对手牌堆 = 你所在档的全部舰队 + 下一档和上一档<b>各随机 1 支</b>，去掉上一次的对手后洗牌；打完一轮重新洗，<b>永远不会用完</b>。舰队是固定快照，不会按你的强度调整。
    <br><b>Net 海贼等级：</b>每赢一场自由对战 +1 经验（好友对战不算）；等级 R 需要 <b>2R + 3</b> 经验升级，升级后经验归零。从 1 级升到 R 级共需 <b>(R − 1)(R + 3)</b> 场胜利：
    ${[1, 3, 5, 7, 9, 11, 13, 15].map((r, i) => `档 ${i} = ${r} 级 / ${(r - 1) * (r + 3)} 胜`).join('、')}。
    输了不扣经验，但连败达到 5 场后，每再输一场降 1 级（最低 1 级），赢一场清零连败。累计每 20 胜有额外奖励。
    ${t ? `<br>档 ${t.tier} 对应 Net 海贼等级 <b>${t.ranks}</b>：${t.count} 支舰队，最强船员 Lv ${t.lv[0]}–${t.lv[1]}，船员总HP ${fmt(t.hp[0])}–${fmt(t.hp[1])}。` : ''}
    点击一行查看完整阵容，点击表头排序。</p>`;
  $('#out').innerHTML = note + `<div class="card"><table><tr>${th('index', '#', 'n')}${th('name', '舰队')}${th('tier', '档', 'n')}${th('cannon', '大炮')}${th('crew', '船员', 'n')}${th('mon', '怪物', 'n')}${th('lv', '最高 Lv', 'n')}${th('avg', '平均 Lv', 'n')}${th('hp', '船员总HP', 'n')}${th('atk', '船员总攻击', 'n')}</tr>` +
    rows.map(f => `<tr class="fleet${open.has(f.index) ? ' open' : ''}" data-i="${f.index}"><td class="n">${f.index}</td><td>${hl(f.name, q)}</td>
      <td class="n"><span class="tierlbl">${f.tier}</span></td><td>${hl(f.cannon, q)}</td><td class="n">${f.crew.length}</td><td class="n">${f.monsters.length}</td>
      <td class="n">${f.crewLvMax}</td><td class="n">${f.crewLvAvg}</td>
      <td class="n"><span class="bar" style="width:${Math.round(f.hp / maxHp * 40)}px"></span>${fmt(f.hp)}</td><td class="n">${fmt(f.atk)}</td></tr>` +
      (open.has(f.index) || (q && rows.length <= 3) ? roster(f, q) : '')).join('') + '</table></div>';
  save();
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { st.tier = +b.dataset.t; render(); } });
$('#out').addEventListener('click', e => {
  const h = e.target.closest('th[data-k]');
  if (h) { if (st.key === h.dataset.k) st.dir = -st.dir; else { st.key = h.dataset.k; st.dir = ['name', 'cannon', 'index', 'tier'].includes(h.dataset.k) ? 1 : -1; } render(); return; }
  const r = e.target.closest('tr.fleet'); if (!r) return;
  const i = +r.dataset.i; open.has(i) ? open.delete(i) : open.add(i); render();
});
let timer; $('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 120); });
render();
</script>
</body>
</html>
