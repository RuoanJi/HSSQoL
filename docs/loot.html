<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSS DX Loot</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1f2328; --muted: #6a6f76; --line: #e3e1da;
  --accent: #1f6f8b; --accent-soft: #e3f0f4; --hit: #fff2c2; --hit-ink: #6b4b00; --bar: #8fc1d1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --panel: #1d2126; --ink: #e6e6e3; --muted: #9aa0a6; --line: #30353c;
    --accent: #6fb7d0; --accent-soft: #1f3540; --hit: #4a3d12; --hit-ink: #ffe08a; --bar: #2f6b80;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --panel: #1d2126; --ink: #e6e6e3; --muted: #9aa0a6; --line: #30353c;
  --accent: #6fb7d0; --accent-soft: #1f3540; --hit: #4a3d12; --hit-ink: #ffe08a; --bar: #2f6b80;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
h1 { font-size: 18px; margin: 14px 0 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 10px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--ink); min-width: 0; }
input { flex: 1 1 220px; }
.count { color: var(--muted); font-size: 12px; }
main { padding: 14px 0 40px; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
summary { cursor: pointer; padding: 9px 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
summary .t { font-weight: 600; }
summary .m { color: var(--muted); font-size: 12px; }
.body { padding: 0 12px 12px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
h3 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); font-weight: 600; }
.chip { display: inline-block; padding: 0 6px; margin: 1px 4px 1px 0; border-radius: 4px;
  background: var(--accent-soft); font-size: 12px; white-space: nowrap; }
.chip.hit, mark { background: var(--hit); color: var(--hit-ink); }
mark { padding: 0 2px; border-radius: 3px; }
.bar { display: inline-block; height: 8px; background: var(--bar); border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.fish { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.fish input { flex: none; margin: 0; }
.cost { font-weight: 600; color: var(--ink); }
.badge { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; vertical-align: 1px; }
.badge.rep { background: #dff3e4; color: #1d6b35; }
.badge.once { background: #f1e6e6; color: #8a3030; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge.rep { background: #1f3a28; color: #8fdca6; }
  :root:not([data-theme="light"]) .badge.once { background: #3e2626; color: #f0a0a0; } }
:root[data-theme="dark"] .badge.rep { background: #1f3a28; color: #8fdca6; }
:root[data-theme="dark"] .badge.once { background: #3e2626; color: #f0a0a0; }
.empty { color: var(--muted); padding: 20px 0; }
.rules { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
.rules ul { margin: 4px 0; padding-left: 18px; }
</style>
</head>

function hl(text, q) {
  const t = esc(text);
  if (!q) return t;
  const i = text.toLowerCase().indexOf(q);

}

function perFight(place, el) {
  const perGroup = place.enemies.filter(en => !en.r40).reduce((s, en) => s + en.e * dr(en).filter(d => d[0] === el).reduce((a, d) => a + d[1], 0), 0);

}

function bossTable(boss, el, dungeon) {

function layoutText(L) {
  const g = {};

  if (L.filler) g['战斗'] = (g['战斗'] || 0) + L.filler;
  const order = ['战斗', '宝箱', 'BOSS战'];
  const keys = Object.keys(g).sort((a, b) => ((order.indexOf(a) + 10) % 10) - ((order.indexOf(b) + 10) % 10));
  const fixed = keys.map(k => `${k}×${g[k]}`).join(' · ');

      <li>敌人等级 = 地点等级 × 模式（普通 ×1、困难 ×2、噩梦 ×5），解析道具等级随之变化，可在右上角切换模式。</li></ul></div>`;
  }
  const all = [
    ...D.seas.map(s => ({k: '海域', name: `${s.land} · Lv.${s.lv} 海域`, p: s})),
    ...D.dungeons.map(c => ({k: '迷宫', name: `${c.name} (#${c.id}, Lv ${c.lv}) · ${c.port}`, p: c})),
  ].map(r => ({...r, f: perFight(r.p, el), b: bossHas(r.p, el)}))
   .filter(r => (r.f > 0 || r.b > 0) && (!q || (r.name + ' ' + placeText(r.p)).toLowerCase().includes(q)))
   .sort((a, b) => b.f - a.f || b.b - a.b);
  $('#count').textContent = `${all.length} 个地点掉落 ${E[el]}`;
  const max = Math.max(...all.map(r => r.f), 0.0001);
  return `<table><tr><th>地点</th><th>类型</th><th class="n">解析道具等级</th><th class="n" title="平均掉落个数">每场战斗（个）<br><span class="m">海域：每组</span></th><th class="n">BOSS</th><th class="n">体力</th><th>掉落的敌人</th></tr>` +
    all.map(r => `<tr><td>${hl(r.name, q)} ${repBadge(r.p)}</td><td>${r.k}</td><td class="n">Lv.${M(r.p).dl[0]}–${M(r.p).dl[1]}</td>
      <td class="n"><span class="bar" style="width:${Math.round(r.f / max * 60)}px"></span>${r.f ? r.f.toFixed(r.f >= 0.1 ? 2 : 3) : '—'}</td>
      <td class="n">${r.b ? pct(r.b) : '—'}</td>
      <td class="n">${r.p.cost ? r.p.cost[0] : '—'}</td>
      <td>${r.p.enemies.filter(e => dr(e).some(d => d[0] === el)).map(e => `<span class="chip">${esc(e.n)}</span>`).join('')}</td></tr>`).join('') + '</table>';
}
function renderPickups() {
  $('#count').textContent = '';
  return `<p class="note">敌人没有掉落解析道具时，有 50% 几率掉落一个甲板小物品。使用哪张表由敌人的阶级决定（0 = 普通 … 4 = 队长）。数值为原始权重（此表的具体判定方式尚未解析，请视为相对概率）。</p>` +
    D.pickups.map(t => `<details open><summary><span class="t">阶级 ${t.tier}</span></summary><div class="body"><table>
      <tr><th>物品</th><th class="n">权重</th></tr>${t.rows.map(([n, w]) => `<tr><td>${esc(n)}</td><td class="n">${w}</td></tr>`).join('')}</table></div></details>`).join('');
}
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const q = $('#q').value.trim().toLowerCase();
  const el = +sel.value;
  $('#elem').style.display = tab === 'pickups' ? 'none' : '';
  $('#q').style.display = tab === 'pickups' ? 'none' : '';
  $('#out').innerHTML = {farm: renderFarm, seas: renderSeas, dungeons: renderDungeons, pickups: renderPickups}[tab](q, el);
  const ds = $('#dsort'); if (ds) ds.value = dsort;
  const dr2 = $('#drep'); if (dr2) dr2.value = drep;
}
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  tab = t.dataset.t; try { localStorage.setItem('hssLootTab', tab); } catch (e) {}
  render();
});
let timer; $('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 120); });
sel.addEventListener('change', render);
$('#out').addEventListener('change', e => { if (e.target.id === 'dsort') { dsort = e.target.value; render(); }
  if (e.target.id === 'drep') { drep = e.target.value; render(); } });
$('#fish').addEventListener('change', render);
$('#mode').value = String(mode);
$('#mode').addEventListener('change', e => { mode = +e.target.value; try { localStorage.setItem('hssLootMode', mode); } catch (x) {} render(); });
render();
</script>
</body>
</html>
